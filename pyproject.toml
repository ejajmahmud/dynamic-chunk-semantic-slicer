[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-chunk-semantic-slicer"
version = "0.1.0"
description = "Density-adaptive boundary detection and semantic token chunking tool for unstructured agent ingest"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
dynamic-chunk-semantic-slicer = "dynamic_chunk_semantic_slicer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dynamic_chunk_semantic_slicer*"]
